# Déploiement "1 clic" du mini-serveur admin sur Render (https://render.com).
# Sur Render : New + → Blueprint → connecte ce dépôt → il lit ce fichier.
# Renseigne ensuite les 3 secrets (domaine, jeton Admin, mot de passe admin).
services:
  - type: web
    name: cash16-admin-server
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: SHOPIFY_STORE_DOMAIN
        sync: false
      - key: SHOPIFY_ADMIN_TOKEN
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: SHOPIFY_API_VERSION
        value: 2025-04
